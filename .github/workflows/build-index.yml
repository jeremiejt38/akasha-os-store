name: Validate manifests and build index

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema requests

      - name: Validate manifests
        run: python .github/scripts/validate_manifests.py

      - name: Build index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python .github/scripts/build_index.py

      - name: Commit index.json if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "No changes to index.json"
          else
            git commit -m "chore: regenerate index.json [bot]"
            git push
          fi
